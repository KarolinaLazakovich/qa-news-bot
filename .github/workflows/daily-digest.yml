name: QA News Digest

on:
  schedule:
    # 09:00 Minsk time (UTC+3) = 06:00 UTC, weekdays only
    - cron: '0 6 * * 1-5'
  workflow_dispatch:  # allows manual trigger from GitHub Actions UI

jobs:
  send-digest:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: qa-news-bot/requirements.txt

      - name: Install dependencies
        run: pip install -r qa-news-bot/requirements.txt

      - name: Run digest bot
        working-directory: qa-news-bot/bot
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python main.py
